<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Technique Review | Du Airlines Elite Academy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0c1520;color:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:760px;margin:32px auto}.brand{font-size:12px;letter-spacing:.15em;color:#d2b47e;font-weight:800}.intro{color:#aab9c9;line-height:1.6}.panel{padding:24px;border:1px solid #344153;border-radius:20px;background:#172334}label{display:block;margin:16px 0 6px}input{width:100%;padding:14px;border:1px solid #516072;border-radius:10px;background:#0d1828;color:white;font:inherit}button{border:0;border-radius:10px;background:#d2b47e;color:#17202a;font:inherit;font-weight:750;padding:13px 18px;margin-top:16px;cursor:pointer}button:disabled{opacity:.5}#error{color:#fda4af}#review{min-height:60px}a{color:#d2b47e}</style></head><body><main><div class="brand">DU AIRLINES ELITE ACADEMY</div><h1>Technique Review</h1><p class="intro">Share a short video of your movement. Coach Du will review it and send clear, practical feedback. No exercise selection needed.</p><section id="login" class="panel" hidden><h2>Parent or athlete sign in</h2><p class="intro">Use your existing private athlete or parent account.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="sign-in" type="submit">Sign in</button></form></section><section id="signed" hidden><p id="account" class="intro"></p><button id="signout" type="button">Sign out</button><div id="review"></div></section><p id="error" role="alert"></p><p class="intro"><a href="/#/hub">Back to Performance Hub</a></p></main><script type="module">import{attachTechniqueReview}from'./performance/technique-review-bridge.js';import{mountParentTechniqueReview}from'./performance/technique-review-parent-ui.js';const db=window.supabase.createClient('https://hiktwkdfvlujszczthdu.supabase.co','sb_publishable_MKg9hNp7WuDlnK0TnlwwtQ_n8j4-dYx',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let widget;async function render(){const{data:{session},error}=await db.auth.getSession();if(error)throw error;$('login').hidden=!!session;$('signed').hidden=!session;$('error').textContent='';if(widget){widget.destroy();widget=null;}$('review').replaceChildren();if(!session)return;$('account').textContent='Signed in as '+session.user.email;try{let athleteMode=false;try{const probe=await fetch('https://hiktwkdfvlujszczthdu.supabase.co/functions/v1/technique-review-private',{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_MKg9hNp7WuDlnK0TnlwwtQ_n8j4-dYx',authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'context'})});athleteMode=probe.ok;}catch{}if(athleteMode){const api=async(action,payload={})=>{const res=await fetch('https://hiktwkdfvlujszczthdu.supabase.co/functions/v1/technique-review-private',{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_MKg9hNp7WuDlnK0TnlwwtQ_n8j4-dYx',authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const data=await res.json();if(!res.ok)throw Error(data.error||'Video service unavailable');return data};widget=mountParentTechniqueReview({root:$('review'),api,athleteId:'private-athlete',uploadSigned:async({path,token,file})=>{const{error}=await db.storage.from('technique-review').uploadToSignedUrl(path,token,file,{contentType:file.type||'video/mp4'});if(error)throw error}});}else{widget=await attachTechniqueReview({role:'parent',root:$('review'),supabase:db,jwt:session.access_token,enabled:true});}if(!widget)throw Error('Technique Review unavailable');}catch(e){$('error').textContent=e.message||'Unable to load Technique Review';}}$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('sign-in').disabled=true;$('error').textContent='';try{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await render()}catch(err){$('error').textContent=err.message}finally{$('sign-in').disabled=false}});$('signout').onclick=async()=>{await db.auth.signOut();await render()};render().catch(e=>$('error').textContent=e.message);</script></body></html>

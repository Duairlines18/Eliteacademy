name: Full delivery regression QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'link-previews/**'
      - 'soccer/**'
      - 'club-registration/**'
      - 'track/**'
      - 'hub/**'
      - 'athlete-qa/**'
      - 'coach-command/**'
      - 'parent-qa/**'
      - 'hub-delivery/**'
      - 'supabase/**'
      - 'qa/**'
      - '.github/workflows/full-delivery-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full delivery regression tests
        run: |
          set -e
          node --test athlete-qa/*.test.cjs athlete-qa/*.test.mjs coach-command/*.test.cjs coach-command/*.test.mjs parent-qa/*.test.cjs hub-delivery/*.test.cjs supabase/qa/*.test.mjs performance-journey/*.test.cjs performance-journey/*.test.mjs qa/*.test.cjs
          node --test supabase/qa/school-http.integration.mjs
          node homepage-qa/homepage.test.cjs
          node --test link-previews/links.test.cjs
      - name: Verify reversible guided-routine data preparation
        run: |
          npm install --prefix /tmp/du-guided-qa --no-save @electric-sql/pglite@0.5.13
          node --test supabase/qa/guided-routines.database.mjs
        env:
          PGLITE_MODULE: /tmp/du-guided-qa/node_modules/@electric-sql/pglite/dist/index.js
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium QA dependencies
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run real browser smoke checks
        run: node homepage-qa/browser.test.cjs
      - name: Verify dashboard refresh and previous-week feedback on mobile and desktop
        run: node hub-delivery/dashboard-refresh.browser.cjs
      - name: Verify private athlete onboarding on mobile and desktop
        run: node qa/private-onboarding.browser.cjs
      - name: Verify routines across Hub roles on mobile and desktop
        run: node hub-delivery/routines.browser.cjs
      - name: Verify guided parent and private programmes with independent synthetic accounts
        run: node hub-delivery/guided-training.browser.cjs
      - name: Verify plain-language workouts, order and visible conditions across Hub roles
        run: node hub-delivery/plain-language.browser.cjs
      - name: Verify six identified school athletes and named staff on mobile and desktop
        run: node hub-delivery/school-identity.browser.cjs
      - name: Verify coach dashboard, current week and saved workout links across screen sizes
        run: node coach-command/route-parity.browser.cjs
  story-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Story and homepage isolation regression
        run: node my-journey/story.test.cjs

name: Exercise video regression
on:
  push:
    branches:
      - fix/exercise-video-sync-regression-20261019
  pull_request:
    paths:
      - 'qa/workout-validation.js'
      - 'qa/workout-validation.test.cjs'
      - 'qa/check-workout-delivery.mjs'
      - 'hub-delivery/delivery.js'
      - 'hub-delivery/delivery.test.cjs'
      - '.github/workflows/exercise-video-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated validator and delivery regressions
        run: node --test qa/workout-validation.test.cjs hub-delivery/delivery.test.cjs
      - name: Check delivery QA script syntax
        run: node --check qa/check-workout-delivery.mjs
      - name: Check shared validator syntax
        run: node --check qa/workout-validation.js
      - name: Smoke-test full delivery QA module loading
        shell: bash
        run: |
          set -o pipefail
          node qa/check-workout-delivery.mjs > /tmp/delivery-smoke.log 2>&1 && exit 1
          cat /tmp/delivery-smoke.log
          grep -Fq 'Usage: node qa/check-workout-delivery.mjs' /tmp/delivery-smoke.log
      - name: Exercise full delivery script initialization
        shell: bash
        run: |
          printf '{"athletes":[],"weeks":[],"days":[],"blocks":[],"exercises":[]}' > /tmp/synthetic-empty-export.json
          node qa/check-workout-delivery.mjs /tmp/synthetic-empty-export.json
      - name: End-to-end synthetic published athlete workout
        shell: bash
        run: |
          cat > /tmp/synthetic-workout.json <<'JSON'
          {
            "athletes":[{"id":"synthetic-athlete","name":"Synthetic Athlete","programme_id":"synthetic-programme","current_week":1}],
            "weeks":[{"id":"synthetic-week","programme_id":"synthetic-programme","week_number":1,"status":"live","verification_status":"verified","published_at":"2026-10-01T12:00:00Z"}],
            "days":[{"id":"synthetic-day","programme_week_id":"synthetic-week","day_key":"Day 1","title":"Strength","sort_order":1}],
            "blocks":[{"id":"synthetic-block","training_day_id":"synthetic-day","title":"Strength","sort_order":1,"content":{"items":["Calf Raise — 3 x 10"],"prescriptions":[{"exerciseCode":"STR01","dosage":"3 x 10","rest":"60 sec"}],"video_links":[{"item_index":0,"exercise":"Calf Raise","video_url":"https://www.youtube.com/watch?v=abcdefghijk"}]}}],
            "exercises":[{"id":"synthetic-exercise","code":"STR01","name":"Calf Raise","active":true,"video_url":"https://www.youtube.com/watch?v=abcdefghijk","video_id":"abcdefghijk"}]
          }
          JSON
          node qa/check-workout-delivery.mjs /tmp/synthetic-workout.json

name: Coach Command QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'coach-command/**'
      - 'athlete-qa/**'
      - '.github/workflows/coach-command-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coach-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: node --check coach-command/coach-command.js
      - name: Run coach workflow tests
        run: node coach-command/coach-command.test.cjs
      - name: Verify saved school video selection
        run: node coach-command/saved-video-links.test.mjs
      - name: Principal QA school athlete sheet
        run: node athlete-qa/athlete-sheet.test.cjs

      - name: Install WebKit for mobile print QA
        run: |
          npm install --prefix /tmp/du-coach-qa --no-save playwright@1.62.1
          node /tmp/du-coach-qa/node_modules/playwright/cli.js install --with-deps webkit
      - name: Verify coach print preview in WebKit
        run: node coach-command/route-parity.browser.cjs
        env:
          NODE_PATH: /tmp/du-coach-qa/node_modules
          DU_COACH_PRINT_WEBKIT: '1'

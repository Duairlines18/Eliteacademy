name: Premium homepage QA
on:
  pull_request:
    paths: ['index.html', 'homepage-qa/**', '.github/workflows/homepage-qa.yml']
  push:
    branches: [main, homepage-premium-redesign-review]
    paths: ['index.html', 'homepage-qa/**', '.github/workflows/homepage-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check homepage and protected integration baseline
        run: node homepage-qa/homepage.test.cjs
      - name: Run existing Hub regression tests
        run: |
          node coach-command/coach-command.test.cjs
          node athlete-qa/athlete-sheet.test.cjs
          node athlete-qa/air-zim.test.cjs
          node athlete-qa/air-zim-tools.test.cjs
          node athlete-qa/exercise-categories.test.cjs
          node coach-command/air-zim.test.cjs
          node parent-qa/parent-session.test.cjs
          node parent-qa/session-card-polish.test.cjs
          npm install --prefix /tmp/du-checkin-qa --no-save @electric-sql/pglite@0.5.13 jsdom@26.1.0
          node --test supabase/qa/*.test.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check mobile and desktop flows
        env:
          HOMEPAGE_SCREENSHOT_DIR: ${{ runner.temp }}/founder-homepage
        run: |
          mkdir -p "$HOMEPAGE_SCREENSHOT_DIR"
          node homepage-qa/browser.test.cjs
      - name: Upload founder homepage screenshots
        uses: actions/upload-artifact@v4
        with:
          name: founder-homepage-screenshots
          path: ${{ runner.temp }}/founder-homepage/*.png
          if-no-files-found: error
          retention-days: 14

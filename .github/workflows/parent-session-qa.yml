name: Parent setup and session QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'parent-qa/**'
      - 'parent-setup/**'
      - 'supabase/functions/_shared/parent-*.ts'
      - 'supabase/functions/_shared/supabase-repository.ts'
      - 'supabase/migrations/*parent_athlete_setup.sql'
      - 'supabase/qa/parent-*'
      - '.github/workflows/parent-session-qa.yml'
  workflow_dispatch:
jobs:
  parent-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/du-parent-qa --no-save playwright@1.56.1 @electric-sql/pglite@0.5.13
      - run: node /tmp/du-parent-qa/node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: node --check parent-setup/setup.js && node --check parent-qa/session-card-polish.js
      - run: node --test supabase/qa/parent-onboarding.test.mjs supabase/qa/account-delivery.test.mjs supabase/qa/access-security.test.mjs
      - run: node parent-qa/parent-session.test.cjs && node parent-qa/session-card-polish.test.cjs && node athlete-qa/athlete-sheet.test.cjs
      - run: node supabase/qa/parent-setup.database.cjs
        env:
          NODE_PATH: /tmp/du-parent-qa/node_modules
      - run: node parent-qa/parent-setup.browser.cjs
        env:
          NODE_PATH: /tmp/du-parent-qa/node_modules
          RUN_WEBKIT: '1'

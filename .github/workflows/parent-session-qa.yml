name: Parent session card QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'parent-qa/**'
      - '.github/workflows/parent-session-qa.yml'
  workflow_dispatch:
jobs:
  parent-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node parent-qa/parent-session.test.cjs
      - run: node athlete-qa/athlete-sheet.test.cjs

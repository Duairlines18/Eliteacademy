# Deploy static content and CoachDU Performance Intelligence to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require workout delivery regression pass
        run: |
          node --test athlete-qa/workout-delivery.test.mjs qa/workout-validation.test.cjs supabase/qa/resolve-delivery-target.test.mjs supabase/qa/validate-delivery.test.mjs
          node athlete-qa/athlete-sheet.test.cjs
          node athlete-qa/air-zim.test.cjs
          node coach-command/saved-video-links.test.mjs
          node parent-qa/parent-session.test.cjs
      - name: Verify public share links
        run: node --test link-previews/links.test.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare deployed Hub HTML
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="/parent-qa/session-card-polish.css">'
          scripts = '<script defer src="/parent-qa/session-card-polish.js"></script>'
          bridge = '<script defer src="/performance/coachdu-hub-bridge.js"></script>'
          assert '</head>' in html, 'Cannot safely add session card assets'
          if marker not in html:
              html = html.replace('</head>', marker + '\n' + scripts + '\n' + bridge + '\n</head>', 1)
          if bridge not in html:
              html = html.replace('</head>', bridge + '\n</head>', 1)
          # Owner-only route at the exact pending-programme state. Do not affect other members.
          needle = "  function renderAccountStatus(audience,error){"
          replacement = """  function renderAccountStatus(audience,error){
              if(audience==='professional' && error?.code==='NO_ASSIGNMENT'){
                const client=accountClient();
                if(client){
                  client.auth.getSession().then(({data})=>{
                    const email=data?.session?.user?.email?.toLowerCase();
                    if(email==='coachdu@duairlineseliteacademy.com'){
                      location.replace('/performance/');
                    }
                  }).catch(()=>{});
                }
              }
          """.rstrip() + "\n"
          assert needle in html, 'Hub status handler missing'
          if replacement not in html:
              html = html.replace(needle, replacement, 1)
          coach_script = Path("coach-command/coach-command.js")
          coach_version = sha256(coach_script.read_bytes()).hexdigest()[:12]
          html, rewritten = re.subn(
              r'(<script src="/coach-command/coach-command\.js)(?:\?[^"]*)?">',
              r'\g<1>?v=' + coach_version + '">',
              html,
          )
          assert rewritten == 1, 'Expected exactly one Coach Command script'
          path.write_text(html, encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          # Upload entire repository
          path: '.'
      - name: Wait for exact uploaded Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false)] | length') || count=0
            if [ "$count" = "1" ]; then
              echo "Exact deployment artifact available"
              exit 0
            fi
            sleep 6
          done
          echo "Pages artifact not visible to deployment API" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

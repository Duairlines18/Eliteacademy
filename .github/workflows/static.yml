# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Include responsive session cards in deployed HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="/parent-qa/session-card-polish.css">'
          scripts = '<script defer src="/parent-qa/session-card-polish.js"></script>'
          bridge = '<script defer src="/performance/coachdu-hub-bridge.js"></script>'
          assert '</head>' in html, 'Cannot safely add session card assets'
          if marker not in html:
              html = html.replace('</head>', marker + '\n' + scripts + '\n' + bridge + '\n</head>', 1)
          if bridge not in html:
              html = html.replace('</head>', bridge + '\n</head>', 1)
          path.write_text(html, encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

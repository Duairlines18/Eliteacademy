<style>
  /* ---------- Design tokens ---------- */
  :root{
    --ink:#0a1c14;          /* darkest green, near-black */
    --green:#0f271c;        /* base deep green */
    --green-2:#143222;      /* raised panels */
    --green-3:#1a3d2a;      /* hover / card lift */
    --gold:#c7a25a;         /* primary gold accent */
    --gold-soft:#dcc38c;    /* lighter gold, headlines */
    --cream:#f3efe4;        /* primary text */
    --sage:#94a89a;         /* muted secondary text */
    --sage-dim:#6f8578;     /* faint labels */
    --hair:rgba(199,162,90,.20);   /* gold hairline */
    --hair-soft:rgba(243,239,228,.10);

    --serif:"Playfair Display", Georgia, "Times New Roman", serif;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

    --maxw:1120px;
    --pad:clamp(1.25rem, 5vw, 2.5rem);
    --gap:clamp(3.5rem, 8vw, 7rem);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:72px}
  body{
    margin:0;
    background:var(--green);
    color:var(--cream);
    font-family:var(--sans);
    font-weight:400;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}

  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
  .section{padding-block:var(--gap)}

  /* eyebrow label */
  .eyebrow{
    font-family:var(--sans);
    font-size:.72rem;
    font-weight:500;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 1.1rem;
  }
  .eyebrow.center{text-align:center}

  /* headline treatment â€” italic gold accent word is the signature move */
  h2.head{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(1.9rem, 4.6vw, 3.1rem);
    line-height:1.08;
    letter-spacing:-.01em;
    margin:0 0 1.4rem;
  }
  h2.head.center{text-align:center;margin-inline:auto}
  .accent{color:var(--gold-soft);font-style:italic}

  .lede{color:var(--sage);font-size:1.05rem;max-width:62ch}
  .lede.center{margin-inline:auto;text-align:center}

  /* buttons */
  .btn{
    display:inline-flex;align-items:center;gap:.6rem;
    font-family:var(--sans);font-weight:500;font-size:.92rem;
    letter-spacing:.02em;
    padding:.9rem 1.6rem;border-radius:2px;
    border:1px solid transparent;cursor:pointer;
    transition:transform .18s ease, background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn-primary{background:var(--gold);color:var(--ink);}
  .btn-primary:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .btn-ghost{background:transparent;color:var(--cream);border-color:var(--hair)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold-soft);transform:translateY(-2px)}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(8,22,15,.86);
    backdrop-filter:saturate(140%) blur(10px);
    border-bottom:1px solid var(--hair-soft);
  }
  .topbar .row{
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;height:58px;
  }
  .wordmark{
    font-family:var(--sans);font-weight:600;
    font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--cream);white-space:nowrap;
  }
  .wordmark b{color:var(--gold)}
  .topnav{display:none;gap:2rem;align-items:center}
  .topnav a{font-size:.82rem;color:var(--sage);letter-spacing:.02em;transition:color .2s}
  .topnav a:hover{color:var(--gold-soft)}
  .top-cta{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  @media(min-width:920px){ .topnav{display:flex} }

    display:flex;flex-direction:column;justify-content:flex-end;
  }
  .hero-photo-note{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--sage-dim);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    pointer-events:none;
  }
  .hero-inner{position:relative;z-index:2;padding-bottom:clamp(2rem,6vw,4rem)}
  .hero-kicker{
    display:flex;gap:.7rem;align-items:center;justify-content:center;flex-wrap:wrap;
    font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);
    margin-bottom:1.2rem;
  }
  .hero-kicker span{opacity:.5}
  h1.hero-title{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(2.5rem, 7vw, 4.6rem);
    line-height:1.02;letter-spacing:-.015em;
    text-align:center;margin:0 auto;max-width:16ch;
  }
  .hero-sub{
    text-align:center;color:var(--sage);max-width:60ch;margin:1.4rem auto 0;
    font-size:1.02rem;
  }
  .hero-actions{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}

  /* ---------- credentials strip ---------- */
  .creds{background:var(--ink);border-block:1px solid var(--hair)}
  .creds-grid{
    display:grid;grid-template-columns:repeat(2,1fr);
  }
  @media(min-width:760px){ .creds-grid{grid-template-columns:repeat(3,1fr)} }
  @media(min-width:1050px){ .creds-grid{grid-template-columns:repeat(4,1fr)} }
  .cred{
    text-align:center;padding:1.5rem 1rem;
    border-right:1px solid var(--hair-soft);border-bottom:1px solid var(--hair-soft);
  }
  .cred .num{font-family:var(--serif);font-size:1.7rem;color:var(--gold-soft);line-height:1}
  .cred .lab{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-top:.5rem}

  /* ---------- the standard (trust) ---------- */
  .standard-grid{display:grid;gap:clamp(2rem,5vw,3.5rem)}
  @media(min-width:900px){ .standard-grid{grid-template-columns:1.05fr .95fr;align-items:center} }
  .standard-copy p{color:var(--sage);margin:0 0 1.15rem;max-width:58ch}
  .standard-copy p.close{color:var(--cream);font-family:var(--serif);font-style:italic;font-size:1.18rem;line-height:1.5}
  .sig{margin-top:1.8rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-dim)}
  .sig b{color:var(--gold);font-weight:600}

  .media-stack{display:block}
  .ph{
    position:relative;border:1px solid var(--hair);background:var(--green-2);
    border-radius:3px;overflow:hidden;
  }
  .ph.solo img{display:block;width:100%;height:auto}

  /* ---------- experience ---------- */
  .feature-card{
    background:var(--green-2);border:1px solid var(--hair);border-radius:4px;
    padding:clamp(1.6rem,3vw,2.4rem);
    display:grid;gap:1.5rem;align-items:center;
  }
  @media(min-width:820px){ .feature-card{grid-template-columns:1.1fr 1fr} }
  .feature-card h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 .6rem}
  .feature-card .cap-max{
    display:inline-block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);border:1px solid var(--hair);border-radius:2px;padding:.35rem .7rem;margin-bottom:1rem;
  }
  .feature-card p{color:var(--sage);margin:0}
  .svc-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:.55rem .9rem}
  .svc-list li{font-size:.9rem;color:var(--cream);padding-left:1.1rem;position:relative}
  .svc-list li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--gold);border-radius:50%}

  .gains{margin-top:2.5rem;display:grid;gap:2rem}
  @media(min-width:760px){ .gains{grid-template-columns:1fr 1fr} }
  .gains h4{font-family:var(--sans);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 1rem;padding-bottom:.7rem;border-bottom:1px solid var(--hair)}
  .gains ul{list-style:none;margin:0;padding:0;columns:2;column-gap:1.5rem}
  .gains li{font-size:.92rem;color:var(--cream);padding:.35rem 0}

  /* ---------- pricing ---------- */
  .price-grid{display:grid;gap:1.4rem}
  @media(min-width:900px){ .price-grid{grid-template-columns:repeat(3,1fr);align-items:start} }
  .price-card{
    background:var(--green-2);border:1px solid var(--hair-soft);border-radius:5px;
    padding:2rem 1.7rem;display:flex;flex-direction:column;height:100%;
    transition:transform .2s ease, border-color .2s ease;
  }
  .price-card:hover{transform:translateY(-4px);border-color:var(--hair)}
  .price-card.feature{
    border-color:var(--gold);background:linear-gradient(180deg,#173925,#0f271c);
    box-shadow:0 24px 60px -32px rgba(199,162,90,.5);
  }
  .price-flag{
    align-self:flex-start;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--ink);background:var(--gold);padding:.3rem .65rem;border-radius:2px;margin-bottom:1rem;
  }
  .price-card h3{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 .35rem}
  .price-amt{font-family:var(--serif);font-size:2.4rem;color:var(--gold-soft);line-height:1;margin:.4rem 0 .2rem}
  .price-amt small{font-family:var(--sans);font-size:.85rem;color:var(--sage);letter-spacing:.04em}
  .price-meta{font-size:.82rem;color:var(--sage);margin:.2rem 0 1.3rem}
  .price-incl{list-style:none;margin:0 0 1.6rem;padding:0;display:grid;gap:.55rem;flex:1}
  .price-incl li{font-size:.88rem;color:var(--cream);padding-left:1.4rem;position:relative}
  .price-incl li::before{content:"âœ”";position:absolute;left:0;color:var(--gold);font-size:.8rem}
  .price-best{font-size:.8rem;color:var(--sage-dim);font-style:italic;margin-bottom:1.2rem}
  .price-card .btn{justify-content:center;width:100%}


  /* ---------- soccer evaluation feature ---------- */
  .soccer-eval-wrap{max-width:920px;margin:2.35rem auto 0}
  .soccer-eval-feature{
    display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:2rem;align-items:center;
    padding:clamp(1.5rem,3vw,2.25rem);background:linear-gradient(135deg,var(--green-2),rgba(20,50,34,.72));
    border:1px solid var(--hair);border-radius:6px
  }
  .soccer-eval-copy h3{
    font-family:var(--serif);font-size:clamp(1.65rem,3vw,2.25rem);line-height:1.05;
    margin:.35rem 0 .75rem
  }
  .soccer-eval-copy p{color:var(--sage);max-width:62ch;margin:0}
  .soccer-eval-points{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.15rem}
  .soccer-eval-points span{
    font-size:.74rem;color:var(--cream);border:1px solid var(--hair-soft);
    padding:.45rem .65rem;border-radius:2px;background:rgba(255,255,255,.025)
  }
  .soccer-eval-action{
    border-left:1px solid var(--hair);padding-left:2rem;text-align:center
  }
  .soccer-eval-price{font-family:var(--serif);font-size:3rem;line-height:1;color:var(--gold-soft)}
  .soccer-eval-meta{display:block;color:var(--sage);font-size:.72rem;margin:.45rem 0 1.1rem}
  .soccer-eval-action .btn{width:100%;justify-content:center}
  @media(max-width:720px){
    .soccer-eval-wrap{margin-top:1.6rem}
    .soccer-eval-feature{grid-template-columns:1fr;gap:1.35rem;padding:1.35rem}
    .soccer-eval-action{
      border-left:0;border-top:1px solid var(--hair);padding-left:0;padding-top:1.2rem;text-align:left
    }
    .soccer-eval-price{font-size:2.45rem}
    .soccer-eval-action .btn{margin-top:.2rem}
    .soccer-eval-points{display:grid;grid-template-columns:1fr}
  }

  /* ---------- focused track form routes ---------- */
  #track-view.track-form-focus > section{display:none}
  #track-view.track-form-focus > section.track-focus-active{display:block}
  .track-form-back{
    display:inline-flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;
    color:var(--gold-soft);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase
  }
  .track-form-back:hover{color:var(--cream)}
  #track-view.track-form-focus .section-compact{padding-top:clamp(2rem,5vw,4rem);padding-bottom:clamp(3rem,7vw,5rem)}


  /* ---------- Track clinic registration â€” Soccer-style flow ---------- */
  .track-clinic-portal{padding-top:clamp(1.25rem,4vw,2.25rem);padding-bottom:clamp(3rem,7vw,5rem)}
  .track-clinic-portal .track-form-back{margin-bottom:1.35rem}
  .track-clinic-portal .fever-reg-intro{margin-top:.35rem}
  .track-clinic-portal .fever-event-card{max-width:760px;margin-left:auto;margin-right:auto}
  .track-clinic-time{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    margin-top:1rem;padding-top:1rem;border-top:1px solid var(--hair-soft)
  }
  .track-clinic-time span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
  .track-clinic-time strong{font-family:var(--serif);font-size:1.35rem;color:var(--cream)}
  .track-clinic-portal #trackClinicRegistrationCard{max-width:760px;margin:1.2rem auto 0}
  .track-clinic-portal .fever-form-wrap{display:block}
  .track-clinic-portal .fever-reg-card{margin-top:0}
  .track-clinic-portal select{width:100%}
  @media(max-width:720px){
    .track-clinic-portal{padding-top:1rem}
    .track-clinic-portal .fever-event-card{margin-top:1rem}
    .track-clinic-portal #trackClinicRegistrationCard{margin-top:1rem}
    .track-clinic-time strong{font-size:1.2rem}
  }

  /* ---------- Soccer + Track offer cleanup (targeted) ---------- */
  #soccer-view #programs,
  #track-view #track-programs{
    padding-top:clamp(2.6rem,6vw,4.6rem);
    padding-bottom:clamp(2.8rem,6vw,4.8rem);
  }
  #soccer-view #programs .lede.center,
  #track-view #track-programs .lede.center{
    max-width:54ch;
    margin-bottom:1.45rem;
  }
  #soccer-view #programs .club-team-pathway{margin-top:1.2rem}
  #soccer-view #programs .soccer-eval-wrap{margin-top:1.2rem}
  #track-view #track-programs .soccer-path-grid{gap:1.1rem}
  #track-view #track-programs .soccer-card{padding:clamp(1.35rem,3vw,1.9rem)}
  #track-view #track-programs .program-list{margin-bottom:1.25rem}

  /* Keep registration mechanics intact, but remove forms from the normal offer journey. */
  #soccer-view #soccer-form{display:none}
  #soccer-view #soccer-form.soccer-booking-open{display:block}
  #track-view:not(.track-form-focus) > #track-clinic-form,
  #track-view:not(.track-form-focus) > #track-form{display:none}

  @media(max-width:720px){
    #soccer-view #programs,
    #track-view #track-programs{
      padding-top:2.25rem;
      padding-bottom:2.5rem;
    }
    #soccer-view #programs .lede.center,
    #track-view #track-programs .lede.center{margin-bottom:1.1rem}
    #soccer-view #programs .club-team-pathway,
    #soccer-view #programs .soccer-eval-wrap{margin-top:1rem}
    #track-view #track-programs .soccer-path-grid{gap:.9rem}
    #track-view #track-programs .soccer-card .btn,
    #soccer-view #programs .btn{width:100%;justify-content:center}
  }

  /* ---------- pathways ---------- */
  .paths{display:grid;gap:1.4rem}
  @media(min-width:820px){ .paths{grid-template-columns:1fr 1fr} }
  .path{
    background:var(--green-2);border:1px solid var(--hair);border-radius:5px;
    padding:clamp(1.7rem,3vw,2.4rem);
  }
  .path h3{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 1.6rem}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{
    counter-increment:s;position:relative;padding:0 0 1.5rem 3rem;color:var(--cream);font-size:.95rem;
  }
  .steps li:last-child{padding-bottom:0}
  .steps li::before{
    content:counter(s);position:absolute;left:0;top:-2px;
    width:2rem;height:2rem;border:1px solid var(--gold);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);color:var(--gold-soft);font-size:.95rem;
  }
  .steps li::after{
    content:"";position:absolute;left:1rem;top:2rem;bottom:.3rem;width:1px;background:var(--hair);
  }
  .steps li:last-child::after{display:none}
  .path .btn{margin-top:1.7rem}

  /* ---------- referral band ---------- */
  .referral{background:var(--ink);border-block:1px solid var(--hair)}
  .referral .inner{display:grid;gap:1rem;align-items:center}
  @media(min-width:820px){ .referral .inner{grid-template-columns:1fr auto} }
  .referral h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0 0 .4rem}
  .referral p{color:var(--sage);margin:0;max-width:64ch}

  /* ---------- get started / contact ---------- */
  .contact-card{max-width:600px;margin:2.6rem auto 0;background:var(--green-2);border:1px solid var(--hair);border-radius:6px;padding:clamp(1.6rem,4vw,2.6rem)}
  .contact-rows{display:grid}
  .contact-row{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--hair-soft)}
  .contact-row:last-child{border-bottom:0}
  .contact-row .cl{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .contact-row a{font-family:var(--serif);font-size:1.15rem;color:var(--cream);transition:color .2s}
  .contact-row a:hover{color:var(--gold-soft)}
  .contact-note{color:var(--sage);font-size:.9rem;font-style:italic;text-align:center;margin:1.3rem 0 0}
  .contact-actions{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1.7rem}
  .contact-actions .btn{flex:1 1 auto;justify-content:center;min-width:150px}
  .contact-followup{text-align:center;max-width:52ch;margin:2.2rem auto 0}
  .contact-followup .cf-head{font-family:var(--serif);font-style:italic;color:var(--gold-soft);font-size:1.15rem;margin:0 0 .4rem}
  .contact-followup p{color:var(--sage);margin:0}
  @media(max-width:520px){ .contact-actions .btn{flex:1 1 100%} }
  /* ---------- footer ---------- */
  footer{background:var(--ink);border-top:1px solid var(--hair)}
  .foot{display:grid;gap:2rem;padding-block:clamp(3rem,6vw,4.5rem)}
  @media(min-width:760px){ .foot{grid-template-columns:1.4fr 1fr 1fr} }
  .foot .brand{font-family:var(--serif);font-size:1.35rem;color:var(--cream)}
  .foot .brand span{color:var(--gold)}
  .foot p{color:var(--sage);font-size:.9rem;margin:.6rem 0 0;max-width:40ch}
  .foot h5{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 .9rem}
  .foot ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
  .foot a,.foot li{color:var(--sage);font-size:.9rem}
  .foot a:hover{color:var(--gold-soft)}
  .foot-bottom{border-top:1px solid var(--hair-soft);padding-block:1.4rem;text-align:center;color:var(--sage-dim);font-size:.78rem;letter-spacing:.04em}

  /* ---------- reveal motion ---------- */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none}
    html{scroll-behavior:auto}
    .btn:hover,.price-card:hover{transform:none}
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .section-tight{padding-block:clamp(3.5rem,7vw,5.5rem)}
  .why-grid,.method-grid,.sport-grid,.partner-grid,.story-grid,.values-grid{
    display:grid;gap:1.15rem
  }
  @media(min-width:760px){
    .why-grid{grid-template-columns:repeat(3,1fr)}
    .method-grid{grid-template-columns:repeat(2,1fr)}
    .sport-grid{grid-template-columns:repeat(3,1fr)}
    .partner-grid{grid-template-columns:repeat(2,1fr)}
    .story-grid{grid-template-columns:repeat(3,1fr)}
    .values-grid{grid-template-columns:repeat(4,1fr)}
  }
  .why-card,.method-card,.sport-card,.partner-card,.story-card,.value-card{
    background:var(--green-2);border:1px solid var(--hair);border-radius:5px;
    padding:clamp(1.35rem,2.5vw,2rem)
  }
  .why-card .index,.method-card .index{
    color:var(--gold);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.7rem
  }
  .why-card h3,.method-card h3,.sport-card h3,.partner-card h3,.story-card h3{
    font-family:var(--serif);font-size:1.35rem;line-height:1.15;margin:0 0 .7rem
  }
  .why-card p,.method-card p,.sport-card p,.partner-card p,.story-card p{color:var(--sage);margin:0}
  .method-card ul,.sport-card ul,.partner-card ul{
    list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.45rem
  }
  .method-card li,.sport-card li,.partner-card li{position:relative;padding-left:1rem;color:var(--cream);font-size:.9rem}
  .method-card li::before,.sport-card li::before,.partner-card li::before{
    content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--gold)
  }
  .story-card{display:flex;flex-direction:column;min-height:100%;border-top:3px solid var(--gold)}
  .story-label{font-size:.63rem;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);margin-bottom:.55rem}
  .story-result{font-family:var(--serif);font-size:1.35rem;color:var(--gold-soft);margin:.2rem 0 .55rem}
  .story-feet{font-size:.78rem;color:var(--sage-dim);margin-top:-.35rem;margin-bottom:.7rem}
  .story-quote{font-family:var(--serif);font-style:italic;color:var(--cream)!important;margin:0 0 1rem!important}
  .story-card .story-open{margin-top:auto;align-self:flex-start;background:none;border:0;color:var(--gold);padding:.5rem 0;cursor:pointer;font:500 .82rem var(--sans);letter-spacing:.04em}
  .story-card .story-open:hover{color:var(--gold-soft)}
  .audience-band{background:var(--ink);border-block:1px solid var(--hair)}
  .sport-tag{font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
  .partnership-cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.6rem}
  .value-card{text-align:center}
  .value-card h3{font-family:var(--serif);color:var(--gold-soft);margin:0 0 .35rem;font-size:1.25rem}
  .value-card p{color:var(--sage);margin:0;font-size:.86rem}
  .story-modal{
    position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    padding:1rem;background:rgba(4,12,8,.86);backdrop-filter:blur(8px)
  }
  .story-modal.open{display:flex}
  .story-dialog{
    width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--green);
    border:1px solid var(--gold);border-radius:7px;padding:clamp(1.4rem,4vw,2.6rem);position:relative
  }
  .story-close{
    position:sticky;float:right;top:0;width:2.35rem;height:2.35rem;border-radius:50%;
    border:1px solid var(--hair);background:var(--ink);color:var(--cream);cursor:pointer;font-size:1.25rem
  }
  .story-dialog h3{font-family:var(--serif);font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:.7rem 2.5rem 1rem 0}
  .story-dialog .modal-result{color:var(--gold-soft);font-family:var(--serif);font-size:1.2rem}
  .story-dialog blockquote{margin:1.2rem 0 0;color:var(--sage);white-space:pre-line}
  .story-dialog .attribution{color:var(--cream);margin-top:1.5rem;font-size:.9rem}

  .story-hero{
    margin:-.2rem 0 1.35rem;
    border:1px solid var(--hair);
    border-radius:5px;
    overflow:hidden;
    background:var(--ink);
  }
  .story-hero img{
    display:block;
    width:100%;
    height:clamp(240px,48vw,430px);
    object-fit:cover;
  }
  .story-hero.story-one img{object-position:center 34%;}
  .story-hero.story-two img{object-position:center 28%;}
  .story-photo-caption{
    padding:.65rem .85rem;
    color:var(--sage);
    font-size:.72rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--ink);
  }
  body.modal-open{overflow:hidden}
  @media(max-width:600px){
    .hero-media{min-height:720px;background-position:center 28%!important}
    .hero-title{max-width:12ch!important}
  }



  /* ---------- V6 responsive hero + typography polish ---------- */
  .hero-kicker{
    font-family:var(--sans);
    font-size:clamp(.82rem,1.15vw,1rem);
    font-weight:800;
    letter-spacing:.18em;
    color:var(--gold-soft);
    text-shadow:0 2px 14px rgba(0,0,0,.55);
  }
  .hero-kicker span{color:var(--gold);opacity:1}
  .method-card h3{
    font-family:var(--sans);
    font-size:clamp(1.35rem,2vw,1.7rem);
    font-weight:800;
    letter-spacing:.055em;
    text-transform:uppercase;
    color:var(--gold-soft);
  }

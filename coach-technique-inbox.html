<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Du | Technique Inbox</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0c1514;color:#f4f5f3}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:760px;margin:18px auto 60px}.brand{font-size:11px;font-weight:800;letter-spacing:.17em;color:#d2b47e}h1{font-size:clamp(28px,7vw,42px);margin:13px 0 6px}.muted{color:#abb8b6;line-height:1.5}.card{background:#152522;border:1px solid #355047;border-radius:18px;padding:20px;margin:16px 0}.clip{background:#10201e;border:1px solid #34473f;border-radius:14px;padding:16px;margin-top:14px}label{display:block;font-size:13px;margin:12px 0 6px;color:#c4cfca}input,textarea{width:100%;font:inherit;background:#0b1715;color:white;border:1px solid #4a6159;border-radius:10px;padding:12px}textarea{min-height:90px;resize:vertical}button{font:inherit;font-weight:750;border:0;border-radius:11px;background:#d2b47e;color:#1d261e;padding:13px 16px;cursor:pointer;margin-top:10px}button:disabled{opacity:.55}.secondary{background:#2d453d;color:#f4f5f3}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-size:12px;color:#d2b47e}video{width:100%;border-radius:10px;margin-top:12px;max-height:380px}.error{color:#fda4af}.success{color:#a8e6c2}a{color:#d2b47e}#list:empty:after{content:'No videos yet.';color:#abb8b6}</style></head><body><main><div class="brand">DU AIRLINES ELITE ACADEMY · CONTROL ROOM</div><h1>Technique Inbox</h1><p class="muted">Watch athlete videos and send clear coaching feedback from your phone. Only authorized academy admins can access submissions.</p><section id="login" class="card" hidden><h2>Coach sign in</h2><p class="muted">Use your academy admin login.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="signin">Sign in</button></form></section><section id="app" hidden><div class="top"><p id="who" class="muted"></p><button class="secondary" id="logout">Sign out</button></div><div class="card"><div class="top"><h2>Received videos</h2><button class="secondary" id="refresh">Refresh</button></div><p id="status" class="muted" role="status">Loading…</p><div id="list"></div></div></section><p id="error" class="error" role="alert"></p><p class="muted"><a href="/#/hub">Back to Performance Hub</a></p></main><script>const db=window.supabase.createClient('https://hiktwkdfvlujszczthdu.supabase.co','sb_publishable_MKg9hNp7WuDlnK0TnlwwtQ_n8j4-dYx',{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);async function api(action,payload={}){const{data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('Sign in again');const r=await fetch('https://hiktwkdfvlujszczthdu.supabase.co/functions/v1/technique-review-admin',{method:'POST',headers:{'content-type':'application/json',apikey:'sb_publishable_MKg9hNp7WuDlnK0TnlwwtQ_n8j4-dYx',authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};async function load(){const status=$('status'),list=$('list');status.textContent='Loading your inbox…';list.replaceChildren();try{const{submissions=[]}=await api('queue');status.textContent=submissions.length+' video'+(submissions.length===1?'':'s')+' received';for(const c of submissions){const card=el('article',null,'clip');const date=c.created_at?new Date(c.created_at).toLocaleString():'';card.append(el('div',(c.review_state==='reviewed'?'Reviewed':'Awaiting review')+' · '+date,'pill'),el('h3','Athlete '+String(c.athlete_id||'').slice(0,8)));const play=el('button','▶ Watch video','secondary');const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='none';video.hidden=true;play.onclick=async()=>{play.disabled=true;try{const v=await api('playback',{id:c.id});video.src=v.url;video.hidden=false;video.load()}catch(e){status.textContent=e.message}finally{play.disabled=false}};card.append(play,video);if(c.review_state!=='reviewed'){const pos=el('input');pos.placeholder='What they did well (optional)';pos.maxLength=500;pos.setAttribute('aria-label','Positive coaching cue');const correction=el('textarea');correction.placeholder='One simple coaching correction';correction.maxLength=1000;correction.setAttribute('aria-label','Coaching correction');const save=el('button','Send feedback to athlete');save.onclick=async()=>{if(!correction.value.trim()){status.textContent='Add a coaching correction first.';return}save.disabled=true;try{await api('review',{id:c.id,correction:correction.value,positiveCue:pos.value});await load()}catch(e){status.textContent=e.message;save.disabled=false}};card.append(el('label','What went well'),pos,el('label','Coaching feedback'),correction,save)}list.append(card)}}catch(e){status.textContent=e.message||'Unable to load inbox'}}async function render(){const{data:{session}}=await db.auth.getSession();$('login').hidden=!!session;$('app').hidden=!session;$('error').textContent='';if(session){$('who').textContent=session.user.email;await load()}}$('form').onsubmit=async e=>{e.preventDefault();$('signin').disabled=true;try{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await render()}catch(e){$('error').textContent=e.message}finally{$('signin').disabled=false}};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();await render()};render().catch(e=>$('error').textContent=e.message);</script></body></html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Discuss School Services | Du Airlines Elite Academy</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06382e;color:#fff;font:16px system-ui,-apple-system,Arial,sans-serif}.card{box-sizing:border-box;max-width:490px;margin:20px;padding:36px 27px;text-align:center;border:1px solid #d9ab5b;border-radius:18px}h1{font-family:Georgia,serif;font-size:32px}p{color:#e0e9e4;line-height:1.6}.brand{font-weight:bold;color:#e6bb6c;letter-spacing:.11em;font-size:12px}.button{display:inline-block;background:#e6bb6c;color:#093c30;text-decoration:none;padding:16px 24px;border-radius:28px;font-weight:750;margin:15px 0}small{color:#d3ddd6}</style></head><body><main class="card"><div class="brand">DU AIRLINES · ELITE ACADEMY</div><h1>Discuss School Services</h1><p>Your email app should open with a ready-to-edit message. Nothing is sent until you choose to send it.</p><a id="email" class="button" href="mailto:coachdu@duairlineseliteacademy.com">Open Email Draft</a><p><small>If the draft does not open automatically, tap the button above.</small></p></main><script>const subj="School athletic development | Du Airlines",message="Hi Coach Du,\n\nI came across the Du Airlines school services overview and would like to learn more about how your programmes could support our school.\n\nSchool: \nMy name and role: \nOur main athletic development priorities: \nSports/events of interest: \n\nWould you be available for a short conversation about what could work for us?\n\nThank you,";const emailLink="mailto:coachdu@duairlineseliteacademy.com?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(message);document.getElementById("email").href=emailLink;window.addEventListener("load",()=>{window.location.href=emailLink});</script></body></html>
